[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-test-synthetic-mechanism"
version = "0.1.0"
description = "Test-only semantic mechanism for SAS mechanism-discovery proofs"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."spectrum_access.mechanisms"]
synthetic_mechanism = "sas_test_synthetic_mechanism:synthetic_mechanism_contract"

[tool.setuptools.packages.find]
where = ["."]
include = ["sas_test_synthetic_mechanism*"]
