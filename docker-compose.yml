services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sas}
    volumes:
      - sas_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sas} -d ${POSTGRES_DB:-sas}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-sas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change_me}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "main.py"]
    env_file:
      - path: .env
        required: false
    environment:
      # Always use Compose service DNS inside the stack (do not inherit host sqlite URLs).
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sas}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-sas}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-sas}:${RABBITMQ_DEFAULT_PASS:-change_me}@rabbitmq:5672//
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-sas}:${RABBITMQ_DEFAULT_PASS:-change_me}@rabbitmq:5672//
      CERTS_DIR: /certs
    ports:
      - "${RSA_PORT:-9000}:9000"
      - "${ECC_PORT:-9001}:9001"
    volumes:
      - ${CERTS_HOST_DIR:-./certs}:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "celery",
        "-A",
        "celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=sas",
        "--concurrency=2",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sas}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-sas}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-sas}:${RABBITMQ_DEFAULT_PASS:-change_me}@rabbitmq:5672//
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-sas}:${RABBITMQ_DEFAULT_PASS:-change_me}@rabbitmq:5672//
      CERTS_DIR: /certs
    volumes:
      - ${CERTS_HOST_DIR:-./certs}:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sas_pg_data:
