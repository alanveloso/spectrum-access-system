# Example custom Spectrum Profile () — campus / private 6 GHz-style composition.
# Not a national regulator profile.
# Copy, rename metadata.id, edit band/classes/parameters, then:
# python -m tools.profile_doctor profiles/profiles/examples/custom_campus_6ghz.yaml

api_version: spectrum-access/v2
kind: SpectrumProfile

metadata:
  id: custom_campus_6ghz
  version: "1.0.0"
  status: custom
  based_on: null
  references:
    - profile_v2_template

spectrum:
  ranges:
    - id: campus_u_nii
      low_hz: 5925000000
      high_hz: 7125000000
  channelization:
    mechanism: fixed_width_channelization
    width_hz: 20000000
    origin_hz: 5925000000
    role: assignment

access:
  mechanism: ordered_classes
  classes:
    - id: safety
      priority: 400
      preemptible: false
    - id: enterprise
      priority: 200
      preemptible: true
    - id: guest
      priority: 100
      preemptible: true

authorization:
  mechanism: dynamic_lease
  duration_s: 600

power:
  mechanism: rule_table
  rules:
    - max_eirp_dbm: 30.0
      max_psd_dbm_mhz: 17.0
      indoor_outdoor: indoor
    - max_eirp_dbm: 36.0
      max_psd_dbm_mhz: 23.0
      indoor_outdoor: outdoor

geography:
  mechanism: point_radius
  center:
    latitude_deg: 37.7749
    longitude_deg: -122.4194
  radius_m: 2000.0

temporal:
  reevaluation:
    mechanism: periodic
    interval_s: 120

protection:
  mechanisms:
    - protection_entitlement
    - channel_exclusion
    - distance_exclusion
    - single_link_threshold
    - aggregate_linear_power

coordination:
  mechanism: snapshot_evaluate_apply

rf:
  required: true
  policy: path_loss_plus_aggregate
  propagation_model: path_loss

data:
  required_capabilities:
    - terrain
    - protected_entities
    - boundaries

requirements:
  device_capabilities:
    - geolocation
    - frequency_range
    - max_eirp
